<style>
  :root{
    --bg:#f1f3f6; --surface:#ffffff; --surface-2:#f7f8fa; --text:#1c2129; --muted:#6d7480;
    --border:#e6e8ec; --primary:#0d9488; --primary-d:#0f766e; --primary-bg:#e6f5f3;
    --income:#16a34a; --income-bg:#e6f7ea; --expense:#dc2626; --expense-bg:#fdeaea;
    --personal:#2563eb; --personal-bg:#e8f0fe; --company:#7c3aed; --company-bg:#f1eafc;
    --shadow:0 1px 3px rgba(20,20,30,.07),0 1px 2px rgba(20,20,30,.04);
    --shadow-lg:0 8px 30px rgba(20,20,30,.18);
    --radius:16px; --radius-sm:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --surface:#1d2026; --surface-2:#242830; --text:#eef0f3; --muted:#9aa1ac;
      --border:#2c313a; --primary:#2dd4bf; --primary-d:#5eead4; --primary-bg:#123632;
      --income:#4ade80; --income-bg:#12301c; --expense:#f87171; --expense-bg:#3a1717;
      --personal:#60a5fa; --personal-bg:#152238; --company:#c4b5fd; --company-bg:#241a3a;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
      --shadow-lg:0 8px 30px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --surface:#1d2026; --surface-2:#242830; --text:#eef0f3; --muted:#9aa1ac;
    --border:#2c313a; --primary:#2dd4bf; --primary-d:#5eead4; --primary-bg:#123632;
    --income:#4ade80; --income-bg:#12301c; --expense:#f87171; --expense-bg:#3a1717;
    --personal:#60a5fa; --personal-bg:#152238; --company:#c4b5fd; --company-bg:#241a3a;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 8px 30px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Tajawal', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;}
  header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 10px;}
  .headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-d));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .brand h1{font-size:16px;font-weight:800;margin:0;}
  .brand p{font-size:11px;color:var(--muted);margin:1px 0 0;display:flex;align-items:center;gap:5px;}
  .dotstatus{width:7px;height:7px;border-radius:50%;display:inline-block;background:#9ca3af;}
  .dotstatus.on{background:var(--income);}
  .dotstatus.off{background:var(--expense);}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text);flex-shrink:0;}
  .icon-btn:active{transform:scale(.93);}

  #app{padding-bottom:110px;}
  .section{padding:14px 16px 0;}
  .section-title{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px;}

  .searchbox{padding:0 16px 10px;}
  .searchbox input{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 16px;font-family:inherit;font-size:13px;}

  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .chip.small{padding:5px 11px;font-size:12px;}

  .customrange{display:none;gap:8px;padding:0 16px 10px;}
  .customrange.show{display:flex;}
  .customrange input{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius-sm);padding:8px 10px;font-family:inherit;font-size:13px;}

  .totalbar{background:linear-gradient(135deg,var(--primary-d),var(--primary));border-radius:var(--radius);padding:16px 18px;color:#fff;box-shadow:var(--shadow);margin-bottom:12px;}
  .totalbar .lbl{font-size:12px;opacity:.85;font-weight:500;}
  .totalbar .val{font-size:26px;font-weight:800;margin-top:2px;}
  .totalbar .sub{display:flex;gap:16px;margin-top:10px;font-size:12px;opacity:.9;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
  .card .ctitle{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;}
  .card .row b{font-weight:700;font-size:13px;}
  .card .net{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;font-size:13px;font-weight:800;}

  .comparewrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .comparewrap::-webkit-scrollbar{display:none;}
  .pcard{flex:0 0 auto;width:150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
  .pcard .phead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .pcard .phead .av{width:26px;height:26px;border-radius:50%;background:var(--primary-bg);color:var(--primary-d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
  .pcard .phead b{font-size:13px;}
  .pcard .prow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px;}
  .pcard .pnet{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:14px;font-weight:800;}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;}

  .daylabel{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;padding:0 2px;}
  .txitem{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:var(--shadow);}
  .txicon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:800;}
  .txbody{flex:1;min-width:0;}
  .txtitle{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .txmeta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap;}
  .badge{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;}
  .txamount{font-size:14.5px;font-weight:800;flex-shrink:0;text-align:left;}
  .txactions{display:flex;gap:4px;margin-right:4px;}
  .miniicon{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--muted);}

  .fab{position:fixed;bottom:24px;left:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--primary-d),var(--primary));color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);border:none;cursor:pointer;z-index:30;}
  .fab:active{transform:scale(.94);}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px 24px;z-index:41;transform:translateY(105%);transition:transform .25s ease;box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto;}
  .sheet.open{transform:translateY(0);}
  .sheethandle{width:38px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 12px;}
  .sheettitle{font-size:16px;font-weight:800;margin:0 0 4px;}
  .sheetsub{font-size:12px;color:var(--muted);margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:var(--radius-sm);padding:11px 6px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .seg button.sel-income{background:var(--income-bg);border-color:var(--income);color:var(--income);}
  .seg button.sel-expense{background:var(--expense-bg);border-color:var(--expense);color:var(--expense);}
  .seg button.sel-personal{background:var(--personal-bg);border-color:var(--personal);color:var(--personal);}
  .seg button.sel-company{background:var(--company-bg);border-color:var(--company);color:var(--company);}
  .seg button.sel-transfer{background:var(--primary-bg);border-color:var(--primary);color:var(--primary-d);}
  .seg3{display:flex;gap:6px;}
  .seg3 button{flex:1;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:var(--radius-sm);padding:10px 4px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .field input, .field textarea, .field select{width:100%;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:var(--radius-sm);padding:11px 12px;font-size:14px;font-family:inherit;}
  .field textarea{resize:none;min-height:44px;}
  .sheetbtns{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;border:none;border-radius:var(--radius-sm);padding:13px;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-ghost{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);}
  .btn-danger{background:var(--expense-bg);color:var(--expense);}
  .btn[disabled]{opacity:.6;}

  .banner{margin:0 16px 10px;background:var(--expense-bg);color:var(--expense);border-radius:var(--radius-sm);padding:9px 12px;font-size:12px;font-weight:700;display:none;text-align:center;}
  .banner.show{display:block;}
  .errbanner{background:var(--expense-bg);color:var(--expense);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;font-weight:700;text-align:center;margin-bottom:12px;display:none;}
  .errbanner.show{display:block;}

  .loginscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px;text-align:center;}
  .loginscreen .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary-d),var(--primary));display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:18px;}
  .loginscreen h2{font-size:17px;font-weight:800;margin:0 0 4px;}
  .loginscreen p{font-size:12.5px;color:var(--muted);margin:0 0 20px;}
  .loginform{width:100%;max-width:300px;text-align:right;}

  .histitem{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
  .histitem .ha{font-weight:700;margin-bottom:3px;}
  .histitem .hd{color:var(--muted);font-size:11.5px;}
  .receiptThumb{width:100%;max-height:160px;object-fit:contain;border-radius:var(--radius-sm);margin-top:8px;border:1px solid var(--border);}

  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:30px;color:var(--muted);gap:10px;font-size:14px;}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="shell">
  <div id="app" class="loading"><div class="spinner"></div><div>...جارِ التحميل</div></div>
</div>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:var(--shadow-lg);"></div>
<script>
(function(){
  "use strict";

  // ====== إعداد Firebase ======
  var DB_URL = "https://hesapat-app-default-rtdb.firebaseio.com";
  var FIREBASE_API_KEY = "AIzaSyDsjKuxk21dxF-A5Hko19ZabZugR8OFJSM";
  var DATA_PATH = "tx_7q2m9k1z";
  var POLL_MS = 4000;
  var RESERVED_KEYS = {'_meta':1,'_transfers':1,'_history':1,'_receipts':1,'_profiles':1};

  var LS_AUTH = 'acc_auth_v2';
  var LS_CACHE = 'acc_cache_v2';

  var state = {
    auth:null, me:null, tx:[], transfers:[], profiles:[], adminId:null, editingId:null, online:false, pollTimer:null, closedUntil:null,
    filters:{range:'month', from:null, to:null, scope:'all', person:'all', search:''}
  };
  function isLocked(dateStr){ return !!(state.closedUntil && dateStr <= state.closedUntil); }
  function findTransfer(id){ return state.transfers.find(function(t){return t.id===id;}); }
  function isAdmin(){ return !!(state.me && state.adminId && state.me.id===state.adminId); }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function localISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayISO(){ return localISO(new Date()); }
  function fmtMoney(n){
    var v = Math.round((n||0)*100)/100;
    var s = new Intl.NumberFormat('ar', {maximumFractionDigits:2, minimumFractionDigits:(v%1!==0)?2:0}).format(Math.abs(v));
    return (v<0? '-' : '') + s + ' ₪';
  }
  function fmtDateLabel(iso){
    var d = new Date(iso+'T00:00:00');
    var days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    var months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    var t = todayISO(); var y=localISO(new Date(Date.now()-86400000));
    if(iso===t) return 'اليوم';
    if(iso===y) return 'الأمس';
    return days[d.getDay()]+'، '+d.getDate()+' '+months[d.getMonth()];
  }
  function fmtWhen(ts){
    var d = new Date(ts);
    return d.toLocaleDateString('ar')+' '+d.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
  }
  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
  }
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.style.opacity='1';
    setTimeout(function(){ el.style.opacity='0'; }, 2200);
  }

  // ---------- مصادقة Firebase (Email/Password عبر REST) ----------
  function loadAuth(){ try{ return JSON.parse(localStorage.getItem(LS_AUTH)||'null'); }catch(e){ return null; } }
  function saveAuth(a){ try{ localStorage.setItem(LS_AUTH, JSON.stringify(a)); }catch(e){} }
  function clearAuth(){ try{ localStorage.removeItem(LS_AUTH); }catch(e){} }

  async function authSignIn(email, password){
    var res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FIREBASE_API_KEY, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email:email, password:password, returnSecureToken:true})
    });
    var data = await res.json();
    if(!res.ok){ throw new Error((data.error&&data.error.message)||'auth_failed'); }
    state.auth = {idToken:data.idToken, refreshToken:data.refreshToken, localId:data.localId, email:data.email, expiresAt: Date.now()+(parseInt(data.expiresIn,10)*1000)};
    saveAuth(state.auth);
    return state.auth;
  }
  async function authRefresh(){
    if(!state.auth || !state.auth.refreshToken) throw new Error('no_refresh_token');
    var res = await fetch('https://securetoken.googleapis.com/v1/token?key='+FIREBASE_API_KEY, {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: 'grant_type=refresh_token&refresh_token='+encodeURIComponent(state.auth.refreshToken)
    });
    var data = await res.json();
    if(!res.ok){ throw new Error('refresh_failed'); }
    state.auth = {idToken:data.id_token, refreshToken:data.refresh_token, localId:data.user_id, email: state.auth.email, expiresAt: Date.now()+(parseInt(data.expires_in,10)*1000)};
    saveAuth(state.auth);
    return state.auth;
  }
  async function ensureToken(){
    if(!state.auth) throw new Error('not_authenticated');
    if(Date.now() > state.auth.expiresAt - 60000){ await authRefresh(); }
    return state.auth.idToken;
  }
  function logout(){ clearAuth(); state.auth=null; state.me=null; location.reload(); }

  // ---------- Firebase REST (Realtime Database) ----------
  function authedUrl(url){
    var token = state.auth && state.auth.idToken;
    if(!token) return url;
    return url + (url.indexOf('?')>-1?'&':'?') + 'auth=' + encodeURIComponent(token);
  }
  async function dbFetch(path, options){
    await ensureToken();
    var res = await fetch(authedUrl(DB_URL+path), options||{});
    if(res.status===401){
      await authRefresh();
      res = await fetch(authedUrl(DB_URL+path), options||{});
    }
    return res;
  }

  async function fbGetAll(){
    var res = await dbFetch('/'+DATA_PATH+'.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch_failed');
    var data = await res.json();
    var list = [];
    if(data){ Object.keys(data).forEach(function(id){ if(RESERVED_KEYS[id]) return; var t = data[id]; t.id = id; list.push(t); }); }
    return list;
  }
  async function fbGetMeta(){
    var res = await dbFetch('/'+DATA_PATH+'/_meta.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch_failed');
    return (await res.json()) || {};
  }
  async function fbPutMeta(data){
    var res = await dbFetch('/'+DATA_PATH+'/_meta.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
    if(!res.ok) throw new Error('save_failed');
  }
  async function fbPut(id, data){
    var res = await dbFetch('/'+DATA_PATH+'/'+id+'.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
    if(!res.ok) throw new Error('save_failed');
  }
  async function fbDelete(id){
    var res = await dbFetch('/'+DATA_PATH+'/'+id+'.json', {method:'DELETE'});
    if(!res.ok) throw new Error('delete_failed');
  }
  async function fbGetTransfers(){
    var res = await dbFetch('/'+DATA_PATH+'/_transfers.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch_failed');
    var data = await res.json(); var list = [];
    if(data){ Object.keys(data).forEach(function(id){ var t = data[id]; t.id = id; list.push(t); }); }
    return list;
  }
  async function fbPutTransfer(id, data){
    var res = await dbFetch('/'+DATA_PATH+'/_transfers/'+id+'.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
    if(!res.ok) throw new Error('save_failed');
  }
  async function fbGetProfile(pid){
    var res = await dbFetch('/'+DATA_PATH+'/_profiles/'+pid+'.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch_failed');
    return await res.json();
  }
  async function fbPutProfile(pid, data){
    var res = await dbFetch('/'+DATA_PATH+'/_profiles/'+pid+'.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
    if(!res.ok) throw new Error('save_failed');
  }
  async function fbGetAllProfiles(){
    var res = await dbFetch('/'+DATA_PATH+'/_profiles.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch_failed');
    var data = await res.json(); var list = [];
    if(data){ Object.keys(data).forEach(function(id){ var p = data[id]; list.push({id:id, name:p.name, role:p.role||'', accountType:p.accountType||'both'}); }); }
    return list;
  }
  async function fbAddHistory(entry){
    var id = uid();
    var res = await dbFetch('/'+DATA_PATH+'/_history/'+id+'.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(entry)});
    if(!res.ok) throw new Error('save_failed');
  }
  async function fbGetHistory(){
    var res = await dbFetch('/'+DATA_PATH+'/_history.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch_failed');
    var data = await res.json(); var list = [];
    if(data){ Object.keys(data).forEach(function(id){ var t = data[id]; t.id = id; list.push(t); }); }
    list.sort(function(a,b){ return (b.at||0)-(a.at||0); });
    return list;
  }
  async function fbPutReceipt(txId, data){
    var res = await dbFetch('/'+DATA_PATH+'/_receipts/'+txId+'.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
    if(!res.ok) throw new Error('save_failed');
  }
  async function fbGetReceipt(txId){
    var res = await dbFetch('/'+DATA_PATH+'/_receipts/'+txId+'.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch_failed');
    return await res.json();
  }
  async function fbDeleteReceipt(txId){
    var res = await dbFetch('/'+DATA_PATH+'/_receipts/'+txId+'.json', {method:'DELETE'});
    if(!res.ok) throw new Error('delete_failed');
  }

  function loadCache(){ try{ return JSON.parse(localStorage.getItem(LS_CACHE)||'[]'); }catch(e){ return []; } }
  function saveCache(list){ try{ localStorage.setItem(LS_CACHE, JSON.stringify(list)); }catch(e){} }

  // ---------- منطق التصفية والتجميع ----------
  function getRangeDates(){
    var f = state.filters; var t = todayISO();
    if(f.range==='today') return {from:t, to:t};
    if(f.range==='week'){ var d=new Date(); d.setDate(d.getDate()-6); return {from:localISO(d), to:t}; }
    if(f.range==='month'){ var d2=new Date(); d2.setDate(1); return {from:localISO(d2), to:t}; }
    if(f.range==='all') return {from:null, to:null};
    return {from:f.from||null, to:f.to||null};
  }
  function passesRange(dateStr, range){
    if(range.from && dateStr < range.from) return false;
    if(range.to && dateStr > range.to) return false;
    return true;
  }
  function distinctPeople(list){
    var ids = [], seen = {};
    list.forEach(function(t){ if(!seen[t.ownerId]){ seen[t.ownerId]=true; ids.push({id:t.ownerId, name:t.ownerName, role:t.ownerRole||''}); } });
    return ids;
  }
  function personLabel(id, name, role){
    var base = id===state.me.id ? 'أنا' : (name || 'مستخدم آخر');
    return role ? (base+' · '+role) : base;
  }
  function computeFiltered(){
    var range = getRangeDates(); var f = state.filters;
    var term = (f.search||'').trim().toLowerCase();
    return state.tx.filter(function(t){
      if(!passesRange(t.date, range)) return false;
      if(f.scope!=='all' && t.scope!==f.scope) return false;
      if(f.person!=='all' && t.ownerId!==f.person) return false;
      if(term && (t.note||'').toLowerCase().indexOf(term)===-1) return false;
      return true;
    }).sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return (b.createdAt||0)-(a.createdAt||0);
    });
  }
  function computeTotals(list){
    var res = {personal:{income:0,expense:0}, company:{income:0,expense:0}};
    list.forEach(function(t){
      if(t.type!=='income' && t.type!=='expense') return;
      var s = res[t.scope]; if(!s){ s = res[t.scope] = {income:0,expense:0}; }
      s[t.type] += (t.amount||0);
    });
    Object.keys(res).forEach(function(k){ res[k].net = res[k].income - res[k].expense; });
    var totIncome=0, totExpense=0;
    Object.keys(res).forEach(function(k){ totIncome+=res[k].income; totExpense+=res[k].expense; });
    return {byScope:res, total:{income:totIncome, expense:totExpense, net:totIncome-totExpense}};
  }
  function scopeLabel(s){ return s==='company' ? 'الشركة' : 'شخصي'; }
  function scopeColorVar(s){ return s==='company' ? '--company' : '--personal'; }
  function scopeBgVar(s){ return s==='company' ? '--company-bg' : '--personal-bg'; }
  function initials(name){ return (name||'؟').trim().slice(0,1); }

  // ---------- عرض ----------
  var appEl, overlayEl, sheetEl;

  function renderFilters(){
    var f = state.filters;
    var ranges = [['today','اليوم'],['week','٧ أيام'],['month','هذا الشهر'],['all','الكل'],['custom','تحديد']];
    var html = '<div class="chiprow" id="rangeChips">';
    ranges.forEach(function(r){ html += '<button class="chip'+(f.range===r[0]?' active':'')+'" data-range="'+r[0]+'">'+r[1]+'</button>'; });
    html += '</div>';
    html += '<div class="customrange'+(f.range==='custom'?' show':'')+'" id="customRangeBox">'+
      '<input type="date" id="fromDate" value="'+(f.from||'')+'">'+
      '<input type="date" id="toDate" value="'+(f.to||'')+'">'+
    '</div>';
    var scopes = [['all','كل الفئات'],['personal','شخصي'],['company','الشركة']];
    html += '<div class="chiprow">';
    scopes.forEach(function(s){ html += '<button class="chip small" data-scope="'+s[0]+'" style="'+(f.scope===s[0]?'background:var(--primary);border-color:var(--primary);color:#fff':'')+'">'+s[1]+'</button>'; });
    html += '</div>';
    var people = distinctPeople(state.tx);
    if(isAdmin() && people.length>1){
      html += '<div class="chiprow" id="personChips">';
      html += '<button class="chip small'+(f.person==='all'?' active':'')+'" data-person="all">الكل</button>';
      people.forEach(function(p){
        var label = p.id===state.me.id ? 'أنا' : esc(p.name||'مستخدم آخر');
        html += '<button class="chip small'+(f.person===p.id?' active':'')+'" data-person="'+esc(p.id)+'">'+label+'</button>';
      });
      html += '</div>';
    }
    return html;
  }

  function renderSummary(totals){
    var t = totals.total;
    var html = '<div class="totalbar">'+
      '<div class="lbl">الصافي في الفترة المحددة</div>'+
      '<div class="val">'+fmtMoney(t.net)+'</div>'+
      '<div class="sub"><span>▲ قبض '+fmtMoney(t.income)+'</span><span>▼ صرف '+fmtMoney(t.expense)+'</span></div>'+
    '</div>';
    html += '<div class="grid2">';
    ['personal','company'].forEach(function(sc){
      var d = totals.byScope[sc] || {income:0,expense:0,net:0};
      html += '<div class="card">'+
        '<div class="ctitle"><span class="dot" style="background:var('+scopeColorVar(sc)+')"></span>'+scopeLabel(sc)+'</div>'+
        '<div class="row"><span>قبض</span><b style="color:var(--income)">'+fmtMoney(d.income)+'</b></div>'+
        '<div class="row"><span>صرف</span><b style="color:var(--expense)">'+fmtMoney(d.expense)+'</b></div>'+
        '<div class="net" style="color:'+(d.net<0?'var(--expense)':'var(--income)')+'"><span>الصافي</span><span>'+fmtMoney(d.net)+'</span></div>'+
      '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderCompareHtml(){
    var range = getRangeDates(); var f = state.filters;
    var scoped = state.tx.filter(function(t){
      if(t.type!=='income' && t.type!=='expense') return false;
      if(!passesRange(t.date, range)) return false;
      if(f.scope!=='all' && t.scope!==f.scope) return false;
      return true;
    });
    var people = distinctPeople(scoped);
    if(people.length < 2) return '';
    var groups = {};
    people.forEach(function(p){ groups[p.id] = {income:0, expense:0, name:p.name, role:p.role}; });
    scoped.forEach(function(t){ groups[t.ownerId][t.type] += (t.amount||0); });
    var html = '<div class="section-title">📊 مقارنة الحركات</div><div class="comparewrap">';
    people.forEach(function(p){
      var g = groups[p.id]; var net = g.income - g.expense;
      var label = personLabel(p.id, p.name, p.role);
      html += '<div class="pcard">'+
        '<div class="phead"><div class="av">'+esc(initials(label))+'</div><b>'+esc(label)+'</b></div>'+
        '<div class="prow"><span>قبض</span><span style="color:var(--income);font-weight:700">'+fmtMoney(g.income)+'</span></div>'+
        '<div class="prow"><span>صرف</span><span style="color:var(--expense);font-weight:700">'+fmtMoney(g.expense)+'</span></div>'+
        '<div class="pnet" style="color:'+(net<0?'var(--expense)':'var(--income)')+'">الصافي: '+fmtMoney(net)+'</div>'+
      '</div>';
    });
    html += '</div>';
    return html;
  }

  function transferLegLabel(t, otherName){ return t==='expense' ? ('تحويل إلى '+otherName) : ('تحويل من '+otherName); }

  function renderTransferBalanceHtml(){
    var range = getRangeDates();
    var accepted = state.transfers.filter(function(t){ return t.status==='accepted' && passesRange(t.date, range); });
    if(accepted.length===0) return '';
    var net = {}; var names = {}; var roles = {};
    accepted.forEach(function(t){
      names[t.fromId]=t.fromName; names[t.toId]=t.toName;
      roles[t.fromId]=t.fromRole||roles[t.fromId]; roles[t.toId]=t.toRole||roles[t.toId];
      net[t.fromId] = (net[t.fromId]||0) - t.amount;
      net[t.toId] = (net[t.toId]||0) + t.amount;
    });

  var pendingScopeChoice = {};

  var sheetState = {type:'expense', scope:'personal', amount:'', date:'', note:'', direction:'give', otherId:'', otherName:'', receiptDataUrl:null, hadReceipt:false};

  function openSheet(id){
    state.editingId = id||null;
    if(id){
      var tx = state.tx.find(function(t){return t.id===id;});
      if(!tx) return;
      if(isLocked(tx.date)){ alert('هاي الحركة مرحّلة (مقفولة) وما بتنعدّل.'); return; }
      if(tx.transferId && findTransfer(tx.transferId) && findTransfer(tx.transferId).status==='pending'){ alert('هاي الحركة جزء من تحويل بانتظار رد الطرف الآخر، ما بتنعدّل لحد ما يتم الرد.'); return; }
      sheetState = {type:tx.type, scope:tx.scope, amount:String(tx.amount), date:tx.date, note:tx.note||'', direction:'give', otherId:'', otherName:'', receiptDataUrl:null, hadReceipt:!!tx.hasReceipt};
    } else {
      var known = state.profiles.filter(function(p){return p.id!==state.me.id;});
      var defScope = (state.me.accountType==='company') ? 'company' : 'personal';
      sheetState = {type:'expense', scope:defScope, amount:'', date:todayISO(), note:'', direction:'give',
        otherId: known[0]?known[0].id:'', otherName: known[0]?known[0].name:'', receiptDataUrl:null, hadReceipt:false};
    }
    renderAddSheet();
    openSheetUI();
  }
  var savedScrollY = 0;

  function resizeImageFile(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 900;
        var scale = Math.min(1, maxW/img.width);
        var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function saveTxFromSheet(){
    var s = sheetState;
    if(s.type==='transfer'){ createTransfer(); return; }
    var amount = parseFloat(String(s.amount).replace(',', '.'));
    if(!amount || amount<=0){ alert('الرجاء إدخال مبلغ صحيح أكبر من صفر'); return; }
    if(!s.date){ alert('الرجاء تحديد التاريخ'); return; }
    var btn = sheetEl.querySelector('#btnSave');
    btn.disabled = true; btn.textContent = 'جارِ الحفظ...';

    var id = state.editingId || uid();
    var isNew = !state.editingId;
    var beforeSnapshot = null;
    var data;
    if(state.editingId){
      var existing = state.tx.find(function(t){return t.id===id;}) || {};
      beforeSnapshot = {type:existing.type, scope:existing.scope, amount:existing.amount, date:existing.date, note:existing.note||''};
      data = Object.assign({}, existing, {type:s.type, scope:s.scope, amount:amount, date:s.date, note:(s.note||'').trim()});
    } else {
      data = {type:s.type, scope:s.scope, amount:amount, date:s.date, note:(s.note||'').trim(), ownerId:state.me.id, ownerName:state.me.name, ownerRole:state.me.role||'', createdAt: Date.now()};
    }
    if(s.receiptDataUrl){ data.hasReceipt = true; }
    delete data.id;

    var idx = state.tx.findIndex(function(t){return t.id===id;});
    var localCopy = Object.assign({id:id}, data);
    if(idx>-1) state.tx[idx] = localCopy; else state.tx.push(localCopy);
    saveCache(state.tx);
    closeSheet();
    renderAll();

    try{
      await fbPut(id, data);
      if(s.receiptDataUrl){ await fbPutReceipt(id, {data:s.receiptDataUrl, mime:'image/jpeg', uploadedAt:Date.now()}); }
      await fbAddHistory({
        action: isNew?'create':'edit', txId:id, byId:state.me.id, byName:state.me.name, byRole:state.me.role||'', at:Date.now(),
        before: beforeSnapshot, after: {type:data.type, scope:data.scope, amount:data.amount, date:data.date, note:data.note}
      });
      state.online = true;
      refreshFromServer();
    }catch(e){
      state.online = false;
      renderAll();
      alert('تعذّر الحفظ على السيرفر — تأكد من الاتصال بالإنترنت وحاول ثانيةً. الحركة محفوظة مؤقتاً على جهازك فقط.');
    }
  }

  async function createTransfer(){
    var s = sheetState;
    var amount = parseFloat(String(s.amount).replace(',', '.'));
    if(!amount || amount<=0){ alert('الرجاء إدخال مبلغ صحيح أكبر من صفر'); return; }
    if(!s.date){ alert('الرجاء تحديد التاريخ'); return; }
    if(!s.otherId){ alert('الرجاء اختيار الطرف الآخر'); return; }
    var btn = sheetEl.querySelector('#btnSave');
    btn.disabled = true; btn.textContent = 'جارِ الإرسال...';

    var otherId = s.otherId;
    var otherName = s.otherName;
    var knownOther = state.profiles.find(function(p){return p.id===otherId;});
    var otherRole = knownOther ? knownOther.role : '';
    var fromId, fromName, fromRole, toId, toName, toRole;
    if(s.direction==='give'){ fromId=state.me.id; fromName=state.me.name; fromRole=state.me.role||''; toId=otherId; toName=otherName; toRole=otherRole; }
    else { fromId=otherId; fromName=otherName; fromRole=otherRole; toId=state.me.id; toName=state.me.name; toRole=state.me.role||''; }

    var transferId = uid();
    var linkedTxId = uid();
    var initiatorType = (fromId===state.me.id) ? 'expense' : 'income';
    var noteTrim = (s.note||'').trim();
    var linkedTx = {
      type: initiatorType, scope: s.scope, amount: amount, date: s.date,
      note: noteTrim || transferLegLabel(initiatorType, otherName),
      ownerId: state.me.id, ownerName: state.me.name, ownerRole: state.me.role||'',
      transferId: transferId, createdAt: Date.now()
    };
    var transferData = {
      status: 'pending', amount: amount, date: s.date, note: noteTrim,
      fromId: fromId, fromName: fromName, fromRole: fromRole,
      toId: toId, toName: toName, toRole: toRole,
      initiatorId: state.me.id, initiatorName: state.me.name,
      initiatorScope: s.scope, initiatorLinkedTxId: linkedTxId,
      counterpartyScope: null, counterpartyLinkedTxId: null,
      createdAt: Date.now()
    };

    state.tx.push(Object.assign({id:linkedTxId}, linkedTx));
    state.transfers.push(Object.assign({id:transferId}, transferData));
    saveCache(state.tx);
    closeSheet();
    renderAll();

    try{
      await fbPut(linkedTxId, linkedTx);
      await fbPutTransfer(transferId, transferData);
      state.online = true;
      refreshFromServer();
    }catch(e){
      state.online = false;
      renderAll();
      alert('تعذّر إرسال التحويل — تأكد من الاتصال بالإنترنت وحاول ثانيةً.');
    }
  }

  async function acceptTransfer(transferId){
    var t = findTransfer(transferId);
    if(!t) return;
    var chosenScope = pendingScopeChoice[transferId] || 'personal';
    var counterpartyType = (t.fromId===state.me.id) ? 'expense' : 'income';
    var linkedTxId = uid();
    var otherName = counterpartyType==='expense' ? t.toName : t.fromName;
    var linkedTx = {
      type: counterpartyType, scope: chosenScope, amount: t.amount, date: t.date,
      note: (t.note||'').trim() || transferLegLabel(counterpartyType, otherName),
      ownerId: state.me.id, ownerName: state.me.name, ownerRole: state.me.role||'',
      transferId: transferId, createdAt: Date.now()
    };
    var updatedTransfer = Object.assign({}, t, {status:'accepted', counterpartyScope:chosenScope, counterpartyLinkedTxId:linkedTxId});
    delete updatedTransfer.id;

    state.tx.push(Object.assign({id:linkedTxId}, linkedTx));
    var tidx = state.transfers.findIndex(function(x){return x.id===transferId;});
    if(tidx>-1) state.transfers[tidx] = Object.assign({id:transferId}, updatedTransfer);
    saveCache(state.tx);
    renderAll();

    try{
      await fbPut(linkedTxId, linkedTx);
      await fbPutTransfer(transferId, updatedTransfer);
      await fbAddHistory({action:'accept_transfer', txId:linkedTxId, byId:state.me.id, byName:state.me.name, byRole:state.me.role||'', at:Date.now(), before:null, after:{amount:t.amount, scope:chosenScope}});
      state.online = true;
      refreshFromServer();
    }catch(e){
      state.online = false;
      alert('تعذّر قبول التحويل — تأكد من الاتصال بالإنترنت وحاول ثانيةً');
      refreshFromServer();
    }
  }

  async function rejectTransfer(transferId){
    var t = findTransfer(transferId);
    if(!t) return;
    if(!confirm('متأكد؟ رح يتم إلغاء التحويل وإلغاء الحركة المرتبطة به.')) return;
    var updatedTransfer = Object.assign({}, t, {status:'rejected'});
    delete updatedTransfer.id;

    state.tx = state.tx.filter(function(x){ return x.id!==t.initiatorLinkedTxId; });
    var tidx = state.transfers.findIndex(function(x){return x.id===transferId;});
    if(tidx>-1) state.transfers[tidx] = Object.assign({id:transferId}, updatedTransfer);
    saveCache(state.tx);
    renderAll();

    try{
      if(t.initiatorLinkedTxId) await fbDelete(t.initiatorLinkedTxId);
      await fbPutTransfer(transferId, updatedTransfer);
      state.online = true;
      refreshFromServer();
    }catch(e){
      state.online = false;
      alert('تعذّر إلغاء التحويل — تأكد من الاتصال بالإنترنت وحاول ثانيةً');
      refreshFromServer();
    }
  }

  async function deleteTx(id){
    var txToDel = state.tx.find(function(t){return t.id===id;});
    if(txToDel && isLocked(txToDel.date)){ alert('هاي الحركة مرحّلة (مقفولة) وما بتنحذف.'); return; }
    if(txToDel && txToDel.transferId){
      var rel = findTransfer(txToDel.transferId);
      if(rel && rel.status==='pending'){ alert('هاي الحركة جزء من تحويل بانتظار الرد — استخدم زر "إلغاء التحويل" بدل الحذف المباشر.'); return; }
    }
    if(!confirm('هل تريد حذف هذه الحركة؟')) return;
    state.tx = state.tx.filter(function(t){ return t.id!==id; });
    saveCache(state.tx);
    renderAll();
    try{
      await fbDelete(id);
      if(txToDel && txToDel.hasReceipt){ try{ await fbDeleteReceipt(id); }catch(e){} }
      await fbAddHistory({action:'delete', txId:id, byId:state.me.id, byName:state.me.name, byRole:state.me.role||'', at:Date.now(),
        before: txToDel? {type:txToDel.type, scope:txToDel.scope, amount:txToDel.amount, date:txToDel.date, note:txToDel.note||''} : null, after:null});
      state.online = true;
    }catch(e){ state.online = false; alert('تعذّر الحذف من السيرفر، تأكد من الاتصال بالإنترنت'); }
    renderAll();
  }

  function exportCSV(){
    var list = computeFiltered();
    if(list.length===0){ alert('ما في حركات للتصدير بالفترة المحددة'); return; }
    var rows = [['التاريخ','النوع','الفئة','المبلغ','ملاحظة','المسجّل']];
    list.forEach(function(t){
      var who = personLabel(t.ownerId, t.ownerName, t.ownerRole);
      rows.push([t.date, t.type==='income'?'قبض':'صرف', scopeLabel(t.scope), t.amount, t.note||'', who]);
    });
    var csv = '\uFEFF'+rows.map(function(r){
      return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(',');
    }).join('\r\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'hesabat-'+todayISO()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

      }
    });
    nameI.addEventListener('keydown', function(e){ if(e.key==='Enter') sheetEl.querySelector('#btnPSave').click(); });
  }

  // ---------- تسجيل الدخول ----------
  function renderLoginScreen(errMsg){
    appEl.className = '';
    appEl.innerHTML =
      '<div class="loginscreen">'+
        '<div class="logo">💰</div>'+
        '<h2>دفتر الحسابات اليومي</h2>'+
        '<p>سجّل دخولك بالإيميل وكلمة السر اللي أعطاك ياها أستاذ أحمد</p>'+
        '<div class="loginform">'+
          (errMsg ? '<div class="errbanner show">'+esc(errMsg)+'</div>' : '')+
          '<div class="field"><label>الإيميل</label><input type="email" id="fEmail" autocomplete="username"></div>'+
          '<div class="field"><label>كلمة السر</label><input type="password" id="fPass" autocomplete="current-password"></div>'+
          '<button class="btn btn-primary" id="btnLogin" style="width:100%;">دخول</button>'+
        '</div>'+
      '</div>';
    var emailI = document.getElementById('fEmail');
    var passI = document.getElementById('fPass');
    var btn = document.getElementById('btnLogin');
    function doLogin(){
      var email = emailI.value.trim(); var pass = passI.value;
      if(!email || !pass){ return; }
      btn.disabled = true; btn.textContent = 'جارِ الدخول...';
      authSignIn(email, pass).then(function(){
        boot();
      }).catch(function(e){
        var msg = 'تعذّر تسجيل الدخول، تأكد من الإيميل وكلمة السر';
        if(String(e.message).indexOf('INVALID_LOGIN_CREDENTIALS')>-1 || String(e.message).indexOf('EMAIL_NOT_FOUND')>-1 || String(e.message).indexOf('INVALID_PASSWORD')>-1) msg = 'الإيميل أو كلمة السر غير صحيحة';
        else if(String(e.message).indexOf('USER_DISABLED')>-1) msg = 'هذا الحساب معطّل';
        renderLoginScreen(msg);
      });
    }
    btn.addEventListener('click', doLogin);
    passI.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  }

  // ---------- الإقلاع ----------
  function startApp(){
    appEl.innerHTML = '';
    var existingHeader = document.querySelector('header');
    if(existingHeader) existingHeader.remove();
    var header = document.createElement('header');
    header.innerHTML =
      '<div class="headrow">'+
        '<div class="brand" id="meBrand" style="cursor:pointer;"><div class="logo">💰</div><div><h1>دفتر الحسابات اليومي</h1><p><span class="dotstatus" id="statusDot"></span>'+esc(state.me.name)+(state.me.role?' · '+esc(state.me.role):'')+' ✎</p></div></div>'+
        '<div style="display:flex;gap:8px;align-items:center;">'+
          '<div class="icon-btn" id="moreBtn" title="خيارات">⋯</div>'+
          '<div class="icon-btn" id="refreshBtn" title="تحديث الآن">↻</div>'+
        '</div>'+
      '</div>';
    document.getElementById('shell').insertBefore(header, appEl);
    document.getElementById('refreshBtn').addEventListener('click', refreshFromServer);
    document.getElementById('moreBtn').addEventListener('click', openMoreMenuSheet);
    document.getElementById('meBrand').addEventListener('click', function(){ openProfileSheet(false); });

    if(!document.querySelector('.fab')){
      var fab = document.createElement('button');
      fab.className = 'fab'; fab.textContent = '+';
      fab.addEventListener('click', function(){ openSheet(null); });
      document.getElementById('shell').appendChild(fab);
    }

    state.tx = loadCache();
    renderAll();
    refreshFromServer();
    startPolling();
  }

  async function boot(){
    appEl = document.getElementById('app');
    overlayEl = document.getElementById('overlay');
    sheetEl = document.getElementById('sheet');
    overlayEl.addEventListener('click', closeSheet);

    if(!state.auth){ state.auth = loadAuth(); }
    if(!state.auth){ renderLoginScreen(); return; }

    appEl.className = 'loading';
    appEl.innerHTML = '<div class="spinner"></div><div>...جارِ التحميل</div>';
    try{
      await ensureToken();
    }catch(e){
      clearAuth(); state.auth = null; renderLoginScreen();
      return;
    }

    try{
      var results = await Promise.all([fbGetProfile(state.auth.localId), fbGetMeta()]);
      var profile = results[0];
      state.adminId = results[1].adminId || null;
      state.closedUntil = results[1].closedUntil || null;
      if(profile && profile.name){
        state.me = {id: state.auth.localId, name: profile.name, role: profile.role||'', accountType: profile.accountType||'both'};
        startApp();
      } else {
        appEl.className = ''; appEl.innerHTML = '';
        openProfileSheet(true);
      }
    }catch(e){
      appEl.className = 'loading';
      appEl.innerHTML = '<div class="spinner"></div><div style="color:var(--expense);">تعذّر الاتصال — تحقق من الإنترنت وأعد فتح الصفحة</div>';
    }
  }

  boot();
})();
</script>
</body>
</html>
